<header class="ng-toolbar-wrap">
  <mat-toolbar class="ng-toolbar">
    <a class="ng-brand" routerLink="/home" aria-label="L'Étoile kitchen home">
      <span class="ng-brand-symbol"><mat-icon>restaurant</mat-icon></span>
      <span class="ng-brand-copy"><strong>L'ÉTOILE</strong><small>KITCHEN · DINING · SERVICE</small></span>
    </a>
    <span class="ng-toolbar-spacer"></span>
    <nav class="ng-desktop-nav" aria-label="Main navigation">
      <a mat-button routerLink="/home" routerLinkActive="ng-active" [routerLinkActiveOptions]="{exact: true}"><mat-icon>dashboard</mat-icon>Home</a>
      <a mat-button routerLink="/menu" routerLinkActive="ng-active"><mat-icon>restaurant_menu</mat-icon>Menu</a>
      <a mat-button routerLink="/about" routerLinkActive="ng-active"><mat-icon>groups</mat-icon>Our team</a>
      <a mat-button routerLink="/contactus" routerLinkActive="ng-active"><mat-icon>event</mat-icon>Visit us</a>
    </nav>
    <button mat-icon-button class="ng-search-trigger" type="button" aria-label="Search menu" [attr.aria-expanded]="searchActive" (click)="toggleSearch()"><mat-icon>search</mat-icon></button>
    <a mat-flat-button color="primary" class="ng-reservation-link" routerLink="/reservations">Reserve a table <mat-icon>arrow_outward</mat-icon></a>
    <button mat-icon-button class="ng-mobile-toggle" type="button" [attr.aria-expanded]="mobileMenuActive" aria-label="Toggle navigation" (click)="toggleMobileMenu()"><mat-icon>{{mobileMenuActive ? 'close' : 'menu'}}</mat-icon></button>
  </mat-toolbar>
  <nav class="ng-mobile-nav" [class.ng-mobile-nav-open]="mobileMenuActive" aria-label="Mobile navigation">
    <a mat-button routerLink="/home" (click)="closeMobileMenu()">Home</a>
    <a mat-button routerLink="/menu" (click)="closeMobileMenu()">Menu</a>
    <a mat-button routerLink="/about" (click)="closeMobileMenu()">Our team</a>
    <a mat-button routerLink="/contactus" (click)="closeMobileMenu()">Visit us</a>
    <a mat-button routerLink="/reservations" (click)="closeMobileMenu()"><mat-icon>event</mat-icon> Reserve a table</a>
  </nav>
  <form class="ng-search-panel" *ngIf="searchActive" (ngSubmit)="performSearch()">
    <mat-form-field appearance="outline"><mat-label>Search the menu</mat-label><mat-icon matPrefix>search</mat-icon><input matInput name="searchQuery" [(ngModel)]="searchQuery" placeholder="Try truffle, mains, dessert"></mat-form-field>
    <button mat-flat-button color="primary" type="submit">Search <mat-icon>arrow_forward</mat-icon></button>
  </form>
</header>
